name: Field Shift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-pipeline-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pipeline & API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt -r apps/api/requirements.txt pytest
      - name: Run pipeline tests
        run: PYTHONPATH=pipeline/src:apps/api pytest pipeline/tests
      - name: Run API scoring & stress-test parity tests
        run: pytest apps/api/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/web ci
      - name: Typecheck & test web
        working-directory: apps/web
        run: |
          npx next typegen
          npx tsc --noEmit
          npm test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci
      - name: Typecheck & test mobile
        run: |
          echo '/// <reference types="expo/types" />' > apps/mobile/expo-env.d.ts
          ./apps/mobile/node_modules/.bin/tsc -p apps/mobile/tsconfig.json --noEmit
          npm --prefix apps/mobile test
